name: Scheduled Hosting Safety Redeploy

# Ajastatud "turvavõrk", mis juurutab kaks korda paevas repositooriumis juba
# committitud public/ sisu Firebase Hostingusse. See ei ekspordi PlutoF
# andmeid uuesti (see toimub reaalajas `seen` CLI kaudu kasutaja Macis, kus
# on ligipääs kohalikule SQLite andmebaasile /Users/metrobee/GEMINI/data/
# plutof_vaatlused.db - GitHubi käivitajal sellele ligipääsu pole). Selle
# tööjärje eesmärk on ise-taastuda juhul, kui fungib.web.app saab kogemata
# ülekirjutatud teise Firebase projekti deployga (vt INCIDENT-2026-09-05 ja
# INCIDENT-2026-09-15) - kuni 12h jooksul taastub see automaatselt oigele
# sisule, ilma kasutaja sekkumiseta.

on:
  schedule:
    # Käivitub automaatselt iga päev kell 03:00 ja 15:00 UTC
    - cron: '0 3,15 * * *'
  workflow_dispatch: # Võimaldab käivitada ka käsitsi ühe klikiga GitHubist

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUNGIB }}'
          channelId: live
          projectId: fungib
